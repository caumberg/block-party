name: Restore Campaign progress track safely
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/campaign-track-v24111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated CSS after existing document without altering JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'id="bpCampaignMenuBar"' in s
          assert 'id="bpCampaignOpen"' in s
          assert 'id="bpArcadeHome"' in s
          assert 'v2.4.107' in s
          assert 'bp-campaign-track-v24111' not in s
          css='''\n<style id="bp-campaign-track-v24111">
          /* Campaign card's original progress track, in normal layout flow. */
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen {
            display:flex!important;flex-direction:column!important;align-items:stretch!important;
            justify-content:center!important;gap:8px!important;
            height:auto!important;min-height:122px!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-title {
            display:flex!important;justify-content:space-between!important;align-items:center!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-progress {
            display:block!important;position:static!important;visibility:visible!important;
            opacity:1!important;line-height:1.3!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track {
            display:block!important;position:static!important;visibility:visible!important;
            opacity:1!important;width:100%!important;height:8px!important;
            flex:0 0 8px!important;margin:0!important;
            border-radius:8px!important;background:#201439!important;overflow:hidden!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen #bpCampaignMenuBar {
            display:block!important;height:100%!important;
            border-radius:8px!important;background:linear-gradient(90deg,#d5a2ff,#ffd47a)!important;
          }
          </style>\n'''
          # Appending a stylesheet after all existing content avoids any accidental
          # replacement of the literal '</head>' embedded in the game's JS strings.
          s+=css
          s=s.replace('v2.4.107 <button type="button" id="bpDeveloperModeOpen"','v2.4.111 <button type="button" id="bpDeveloperModeOpen"',1)
          p.write_text(s,encoding='utf-8')
          print('Added isolated Campaign track CSS; original scripts unchanged')
          PY
      - name: Validate every inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
            def __init__(self):super().__init__();self.active=False;self.buf=[];self.scripts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs);self.active=not a.get('src') and a.get('type','') not in ('application/json','application/ld+json');self.buf=[]
            def handle_data(self,data):
              if self.active:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.active:self.scripts.append(''.join(self.buf));self.active=False
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8'))
          assert len(p.scripts)>=10
          for i,s in enumerate(p.scripts):Path(f'/tmp/bp-campaign-{i}.js').write_text(s,encoding='utf-8')
          print('Checking',len(p.scripts),'scripts')
          PY
          for f in /tmp/bp-campaign-*.js; do node --check "$f"; done
      - name: Commit validated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Campaign progress track without modifying scripts (v2.4.111)"
          git push origin HEAD:main
