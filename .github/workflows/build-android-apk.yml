name: Build Block Party Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'scripts/inject-android-idle-notifications.py'
      - 'scripts/inject-android-daily-notifications.py'
      - 'scripts/style-daily-reward.py'
      - 'scripts/fix-campaign-preview.py'
      - 'scripts/compact-campaign-layout.py'
      - 'scripts/normalize-campaign-previews.py'
      - 'scripts/rebuild-versus-timed-preview.py'
      - 'scripts/fix-android-gameplay-controls.py'
      - 'capacitor.config.json'
      - 'android-controls.css'
      - 'assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage shared web game
        run: |
          mkdir -p www
          cp index.html www/index.html
          python3 scripts/fix-campaign-preview.py www/index.html
          python3 scripts/compact-campaign-layout.py www/index.html
          python3 scripts/rebuild-versus-timed-preview.py www/index.html
          python3 scripts/normalize-campaign-previews.py www/index.html
          python3 scripts/fix-android-gameplay-controls.py
          python3 scripts/inject-android-idle-notifications.py
          python3 scripts/inject-android-daily-notifications.py
          python3 scripts/style-daily-reward.py
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
            def __init__(self):
              super().__init__()
              self.active=False
              self.buf=[]
              self.scripts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs)
                self.active=not a.get('src') and a.get('type','') not in ('application/json','application/ld+json')
                self.buf=[]
            def handle_data(self,data):
              if self.active:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.active:
                self.scripts.append(''.join(self.buf))
                self.active=False
          parser=Scripts()
          parser.feed(Path('www/index.html').read_text(encoding='utf-8'))
          assert len(parser.scripts)>=10, f'Unexpected script count: {len(parser.scripts)}'
          for i,body in enumerate(parser.scripts):
            Path(f'/tmp/bp-android-script-{i}.js').write_text(body,encoding='utf-8')
          PY
          for f in /tmp/bp-android-script-*.js; do node --check "$f"; done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Enable immersive Android fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/blockparty/game/MainActivity.java')
          code = p.read_text()
          assert 'extends BridgeActivity' in code, 'Unexpected Capacitor MainActivity structure'
          code = code.replace('extends BridgeActivity {', '''extends BridgeActivity {
              private void enterImmersiveMode() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }
          ''', 1)
          p.write_text(code)
          PY
      - name: Sync web assets
        run: npx cap sync android
      - name: Generate Android launcher icons from approved artwork
        run: |
          if [ ! -f assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png ]; then
            echo "::warning::assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png not uploaded yet; using default Capacitor launcher icon."
            exit 0
          fi
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png').convert('RGBA')
          if source.width != source.height:
              side = min(source.size)
              x = (source.width - side) // 2
              y = (source.height - side) // 2
              source = source.crop((x, y, x + side, y + side))
          base = Path('android/app/src/main/res')
          for density, px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target = base / ('mipmap-' + density)
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((px,px), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png')
              icon.save(target / 'ic_launcher_round.png')
              # Android adaptive foreground gets safe-zone padding.
              foreground = Image.new('RGBA', (px * 108 // 48, px * 108 // 48), (0,0,0,0))
              fg_size = foreground.width * 72 // 108
              tile = source.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
              offset = (foreground.width - fg_size) // 2
              foreground.alpha_composite(tile, (offset, offset))
              foreground.save(target / 'ic_launcher_foreground.png')
          # Adaptive launcher uses the generated foreground and solid dark background.
          values = base / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'block_party_icon_bg.xml').write_text(
              '<resources><color name="block_party_icon_background">#0C0632</color></resources>')
          for dirname in ('mipmap-anydpi-v26',):
              folder = base / dirname
              folder.mkdir(parents=True, exist_ok=True)
              for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  (folder / name).write_text(
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
                      '<background android:drawable="@color/block_party_icon_background"/>'
                      '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
                      '</adaptive-icon>')
          PY
      - name: Assign increasing Android version code
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('android/app/build.gradle')
          content = p.read_text()
          import re
          version_code = 10000 + int(os.environ['BUILD_NUMBER'])
          updated, count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + str(version_code), content, count=1)
          assert count == 1, 'Unable to find Android versionCode in build.gradle'
          p.write_text(updated)
          print(f'Android versionCode: {version_code}')
          PY
      - name: Restore persistent Android debug signing key
        env:
          BLOCK_PARTY_DEBUG_KEYSTORE_BASE64: ${{ secrets.BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure repository Actions secret BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 to enable consistent APK updates."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "Expected signing certificate:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:'
      - name: Force debug build to use the persistent signing key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          content = p.read_text()
          assert 'android {' in content, 'Android Gradle configuration changed'
          content = content.replace('android {', '''android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          ''', 1)
          assert 'buildTypes {' in content, 'Android buildTypes not found'
          content = content.replace('buildTypes {', '''buildTypes {
              debug {
                  signingConfig signingConfigs.debug
              }
          ''', 1)
          p.write_text(content)
          PY
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK package, version, and signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep '^package:'
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-verification.txt
          cat apk-verification.txt
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > keystore-certificate.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          key = Path('keystore-certificate.txt').read_text()
          apk = Path('apk-verification.txt').read_text()
          expected = next((line.split('SHA256:',1)[1].strip() for line in key.splitlines() if 'SHA256:' in line), None)
          actual = next((line.split('certificate SHA-256 digest:',1)[1].strip() for line in apk.splitlines() if 'certificate SHA-256 digest:' in line), None)
          if not expected or not actual:
              print('::error::Unable to parse certificate fingerprint.')
              raise SystemExit(1)
          normalize = lambda s: s.replace(':', '').lower()
          a, b = normalize(expected), normalize(actual)
          print('Persistent keystore certificate SHA256:', a)
          print('Built APK certificate SHA256:        ', b)
          if a != b:
              print('::error::APK is signed by a different certificate than the persistent keystore.')
              raise SystemExit(1)
          print('APK signature matches persistent signing key.')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
