name: Build Block Party Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-controls.css'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage shared web game
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp android-controls.css www/android-controls.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</head>'
          assert marker in html, 'Expected closing head tag not found'
          html = html.replace(marker, '<link rel="stylesheet" href="android-controls.css">' + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Restore persistent Android debug signing key
        env:
          BLOCK_PARTY_DEBUG_KEYSTORE_BASE64: ${{ secrets.BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure repository Actions secret BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 to enable consistent APK updates."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
