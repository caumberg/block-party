name: Build Block Party Android APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-controls.css'
      - 'android-controls.js'
      - 'assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage shared web game
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp android-controls.css www/android-controls.css
          cp android-controls.js www/android-controls.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '</head>'
          assert marker in html, 'Expected closing head tag not found'
          html = html.replace(marker, '<link rel="stylesheet" href="android-controls.css"><script defer src="android-controls.js"></script>' + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Enable immersive Android fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/blockparty/game/MainActivity.java')
          code = p.read_text()
          assert 'extends BridgeActivity' in code, 'Unexpected Capacitor MainActivity structure'
          code = code.replace('extends BridgeActivity {', '''extends BridgeActivity {
              private void enterImmersiveMode() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }
          ''', 1)
          p.write_text(code)
          PY
      - name: Sync web assets
        run: npx cap sync android
      - name: Generate Android launcher icons from approved artwork
        run: |
          if [ ! -f assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png ]; then
            echo "::warning::assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png not uploaded yet; using default Capacitor launcher icon."
            exit 0
          fi
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('assets/a_high_gloss_neon_styled_app_icon_a_close_up_of.png').convert('RGBA')
          if source.width != source.height:
              side = min(source.size)
              x = (source.width - side) // 2
              y = (source.height - side) // 2
              source = source.crop((x, y, x + side, y + side))
          base = Path('android/app/src/main/res')
          for density, px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target = base / ('mipmap-' + density)
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((px,px), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png')
              icon.save(target / 'ic_launcher_round.png')
              # Android adaptive foreground gets safe-zone padding.
              foreground = Image.new('RGBA', (px * 108 // 48, px * 108 // 48), (0,0,0,0))
              fg_size = foreground.width * 72 // 108
              tile = source.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
              offset = (foreground.width - fg_size) // 2
              foreground.alpha_composite(tile, (offset, offset))
              foreground.save(target / 'ic_launcher_foreground.png')
          # Adaptive launcher uses the generated foreground and solid dark background.
          values = base / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'block_party_icon_bg.xml').write_text(
              '<resources><color name="block_party_icon_background">#0C0632</color></resources>')
          for dirname in ('mipmap-anydpi-v26',):
              folder = base / dirname
              folder.mkdir(parents=True, exist_ok=True)
              for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  (folder / name).write_text(
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
                      '<background android:drawable="@color/block_party_icon_background"/>'
                      '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
                      '</adaptive-icon>')
          PY
      - name: Restore persistent Android debug signing key
        env:
          BLOCK_PARTY_DEBUG_KEYSTORE_BASE64: ${{ secrets.BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure repository Actions secret BLOCK_PARTY_DEBUG_KEYSTORE_BASE64 to enable consistent APK updates."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$BLOCK_PARTY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockParty-Android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
