name: Repair Block Party startup v2.4.109
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-startup-v24109b.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad=re.compile(r"approved\.srcdoc=approvedKey==='obstacles'\?previewHtml:previewHtml\.replace\('<!-- bp-campaign-progress-bar-restored-v24108 -->\n.*?</style>\n</head>',compactCss\+'</head'\);",re.S)
          replacement="approved.srcdoc=approvedKey==='obstacles'?previewHtml:previewHtml.replace('</head>',compactCss+'</head');"
          s,n=bad.subn(lambda m: replacement,s)
          assert n==1, f'Expected one malformed script, found {n}'
          # Use a regex for the document head; its opening tag may contain attributes.
          m=re.search(r'</head\s*>',s,re.I)
          assert m, 'No document head closing tag'
          css='''<style id="bp-campaign-progress-v24109">
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen{padding-bottom:24px!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{display:block!important;position:absolute!important;left:clamp(112px,30%,162px)!important;right:17px!important;bottom:12px!important;width:auto!important;height:7px!important;margin:0!important;opacity:1!important;visibility:visible!important;z-index:3!important;background:rgba(9,6,35,.7)!important;border-radius:20px!important;overflow:hidden!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track #bpCampaignMenuBar{display:block!important;height:100%!important;min-height:7px!important;border-radius:20px!important;background:linear-gradient(90deg,#ff66cb,#ffd26a)!important}
          @media(max-width:390px){#menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{left:clamp(98px,29%,120px)!important;right:11px!important}}
          </style>
          '''
          s=s[:m.start()]+css+s[m.start():]
          s=s.replace('v2.4.108 <button type="button" id="bpDeveloperModeOpen"','v2.4.109 <button type="button" id="bpDeveloperModeOpen"',1)
          p.write_text(s,encoding='utf-8')
          print('Malformed JS fixed, CSS injected, bytes:',len(s))
          PY
      - name: Verify JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b([^>]*)>(.*?)</script\s*>',s,re.I|re.S)
          n=0
          for attrs,body in scripts:
            if re.search(r'\bsrc\s*=',attrs,re.I) or re.search(r'\btype\s*=\s*["\x27](?:application/json|application/ld\+json)',attrs,re.I):continue
            Path(f'/tmp/bp-script-{n}.js').write_text(body,encoding='utf-8');n+=1
          assert n>0
          print('Checking',n,'inline scripts')
          PY
          for f in /tmp/bp-script-*.js; do node --check "$f"; done
      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair startup JavaScript and campaign bar (v2.4.109)"
          git push origin HEAD:main
