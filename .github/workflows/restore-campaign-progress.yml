name: Restore Block Party campaign progress bar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-campaign-progress.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore visible Campaign progress bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assert 'id="bpCampaignMenuBar"' in s, 'Campaign progress bar missing'
          assert 'id="bpCampaignOpen"' in s, 'Campaign button missing'
          marker='<!-- bp-campaign-progress-bar-restored-v24108 -->'
          if marker not in s:
              css='''<style id="bp-campaign-progress-bar-restored-v24108">
          /* Keep the existing level/stars text and the progress track visible. */
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen {
            padding-bottom:24px!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track {
            display:block!important;
            position:absolute!important;
            left:clamp(112px,30%,162px)!important;
            right:17px!important;
            bottom:12px!important;
            width:auto!important;
            height:7px!important;
            margin:0!important;
            opacity:1!important;
            visibility:visible!important;
            z-index:3!important;
            background:rgba(9,6,35,.7)!important;
            border-radius:20px!important;
            overflow:hidden!important;
          }
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track #bpCampaignMenuBar {
            display:block!important;
            height:100%!important;
            min-height:7px!important;
            border-radius:20px!important;
            background:linear-gradient(90deg,#ff66cb,#ffd26a)!important;
          }
          @media(max-width:390px) {
            #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track {
              left:clamp(98px,29%,120px)!important;
              right:11px!important;
            }
          }
          </style>'''
              assert '</head>' in s
              s=s.replace('</head>',marker+'\n'+css+'\n</head>',1)
          s,n=re.subn(r'v2\.4\.(?:105|106|107)(?=\s*<)', 'v2.4.108',s,count=1)
          p.write_text(s,encoding='utf-8')
          print('Campaign progress bar patch applied; version label updates:',n)
          PY
      - name: Commit the repaired game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Already patched"
          else
            git commit -m "Fix Campaign progress bar on home menu (v2.4.108)"
            git push origin HEAD:main
          fi
