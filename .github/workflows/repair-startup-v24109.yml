name: Repair Block Party startup regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-startup-v24109.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore valid JavaScript and safely style campaign bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Prior patch accidentally replaced '</head>' inside a JavaScript string literal.
          bad=re.compile(r"approved\.srcdoc=approvedKey==='obstacles'\?previewHtml:previewHtml\.replace\('<!-- bp-campaign-progress-bar-restored-v24108 -->\n.*?</style>\n</head>',compactCss\+'</head'\);",re.S)
          s,n=bad.subn("approved.srcdoc=approvedKey==='obstacles'?previewHtml:previewHtml.replace('</head>',compactCss+'</head');",s)
          assert n==1, f'Expected one broken JS string, found {n}'
          css='''<style id="bp-campaign-progress-v24109">
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen{padding-bottom:24px!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{display:block!important;position:absolute!important;left:clamp(112px,30%,162px)!important;right:17px!important;bottom:12px!important;width:auto!important;height:7px!important;margin:0!important;opacity:1!important;visibility:visible!important;z-index:3!important;background:rgba(9,6,35,.7)!important;border-radius:20px!important;overflow:hidden!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track #bpCampaignMenuBar{display:block!important;height:100%!important;min-height:7px!important;border-radius:20px!important;background:linear-gradient(90deg,#ff66cb,#ffd26a)!important}
          @media(max-width:390px){#menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{left:clamp(98px,29%,120px)!important;right:11px!important}}
          </style>'''
          assert '<head>' in s and '</head>' in s
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('v2.4.108 <button type="button" id="bpDeveloperModeOpen"','v2.4.109 <button type="button" id="bpDeveloperModeOpen"',1)
          p.write_text(s,encoding='utf-8')
          print('Fixed broken JS string and inserted CSS in actual document head')
          PY
      - name: Validate inline scripts syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
            def __init__(self): super().__init__();self.ins=False;self.scripts=[];self.buf=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script' and not dict(attrs).get('src') and dict(attrs).get('type','') not in ('application/json','application/ld+json'):
                self.ins=True;self.buf=[]
            def handle_data(self,data):
              if self.ins:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
          p=P();p.feed(Path('index.html').read_text())
          for i,s in enumerate(p.scripts):
            Path(f'/tmp/bp-script-{i}.js').write_text(s)
          print(len(p.scripts),'scripts')
          PY
          for f in /tmp/bp-script-*.js; do node --check "$f"; done
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix startup freeze caused by malformed JS in progress bar patch (v2.4.109)"
          git push origin HEAD:main
