name: Block Party startup recovery v2.4.110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-startup-v24110.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair preview JavaScript and insert campaign CSS safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start="approved.srcdoc=approvedKey==='obstacles'?previewHtml:previewHtml.replace("
          end="scene.replaceChildren(sceneTop,approved);"
          a=s.find(start)
          assert a>=0, 'Preview assignment start not found'
          b=s.find(end,a)
          assert b>=0 and b-a<10000, 'Preview assignment end not found'
          region=s[a:b]
          assert region.count('approved.srcdoc=')==1, 'Unexpected preview assignment count'
          # The damaged assignment is followed by a normal scene.replaceChildren call.
          # Restore the complete small region, without attempting to match the injected CSS.
          fixed="approved.srcdoc=approvedKey==='obstacles'?previewHtml:previewHtml.replace('</head>',compactCss+'</head');\n    "
          s=s[:a]+fixed+s[b:]
          assert 'bp-campaign-progress-bar-restored-v24108' not in s, 'Malformed CSS remains inside script'
          body=re.search(r'<body(?:\s|>)',s,re.I)
          assert body, 'Body tag not found'
          css='''<style id="bp-campaign-progress-v24110">
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen{padding-bottom:24px!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{display:block!important;position:absolute!important;left:clamp(112px,30%,162px)!important;right:17px!important;bottom:12px!important;width:auto!important;height:7px!important;margin:0!important;opacity:1!important;visibility:visible!important;z-index:3!important;background:rgba(9,6,35,.7)!important;border-radius:20px!important;overflow:hidden!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track #bpCampaignMenuBar{display:block!important;height:100%!important;min-height:7px!important;border-radius:20px!important;background:linear-gradient(90deg,#ff66cb,#ffd26a)!important}
          @media(max-width:390px){#menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{left:clamp(98px,29%,120px)!important;right:11px!important}}
          </style>
          '''
          s=s[:body.start()]+css+s[body.start():]
          s=s.replace('v2.4.108 <button type="button" id="bpDeveloperModeOpen"','v2.4.110 <button type="button" id="bpDeveloperModeOpen"',1)
          p.write_text(s,encoding='utf-8')
          print('Repaired preview statement and installed CSS')
          PY
      - name: Check every inline script before deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
            def __init__(self):super().__init__();self.ins=False;self.buf=[];self.scripts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs);self.ins=not a.get('src') and a.get('type','') not in ('application/json','application/ld+json');self.buf=[]
            def handle_data(self,data):
              if self.ins:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.ins:self.scripts.append(''.join(self.buf));self.ins=False
          p=P();p.feed(Path('index.html').read_text(encoding='utf-8'))
          assert len(p.scripts)>=10, f'Only {len(p.scripts)} scripts found'
          for i,s in enumerate(p.scripts):Path(f'/tmp/bp-inline-{i}.js').write_text(s,encoding='utf-8')
          print('Checking',len(p.scripts),'scripts')
          PY
          for f in /tmp/bp-inline-*.js; do node --check "$f"; done
      - name: Commit only validated game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Recover Block Party startup and Campaign bar v2.4.110"
          git push origin HEAD:main
