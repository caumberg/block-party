name: Repair Block Party startup v2.4.110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-startup-v24110.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed preview string without touching script literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Replace the entire broken statement, not a generic '</head>' occurrence.
          pattern=r"approved\.srcdoc=approvedKey==='obstacles'\?previewHtml:previewHtml\.replace\('<style id=\"bp-campaign-progress-v24109\">.*?</style>\s*</head>',compactCss\+'</head'\);"
          fixed="approved.srcdoc=approvedKey==='obstacles'?previewHtml:previewHtml.replace('</head>',compactCss+'</head');"
          s,n=re.subn(pattern,lambda _:fixed,s,flags=re.S)
          assert n==1, f'Expected exactly one broken preview expression, found {n}'
          # Insert stylesheet at a real HTML location: immediately before the FIRST body tag.
          # Never search-and-replace generic '</head>' because it also occurs inside JS strings.
          body=re.search(r'<body(?:\s|>)',s,re.I)
          assert body, 'HTML body tag missing'
          assert re.search(r'</head\s*>',s[:body.start()],re.I), 'HTML head not closed before body'
          css='''<style id="bp-campaign-progress-v24110">
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen{padding-bottom:24px!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{display:block!important;position:absolute!important;left:clamp(112px,30%,162px)!important;right:17px!important;bottom:12px!important;width:auto!important;height:7px!important;margin:0!important;opacity:1!important;visibility:visible!important;z-index:3!important;background:rgba(9,6,35,.7)!important;border-radius:20px!important;overflow:hidden!important}
          #menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track #bpCampaignMenuBar{display:block!important;height:100%!important;min-height:7px!important;border-radius:20px!important;background:linear-gradient(90deg,#ff66cb,#ffd26a)!important}
          @media(max-width:390px){#menu.bp-menu-ready #bpArcadeHome #bpCampaignOpen .bp-feature-track{left:clamp(98px,29%,120px)!important;right:11px!important}}
          </style>
          '''
          s=s[:body.start()]+css+s[body.start():]
          s=s.replace('v2.4.108 <button type="button" id="bpDeveloperModeOpen"','v2.4.110 <button type="button" id="bpDeveloperModeOpen"',1)
          assert 'bp-campaign-progress-v24110' in s
          assert "previewHtml.replace('</head>',compactCss+'</head')" in s
          p.write_text(s,encoding='utf-8')
          print('Repaired malformed JS; inserted CSS before body')
          PY
      - name: Validate all inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ScriptParser(HTMLParser):
            def __init__(self): super().__init__();self.active=False;self.buf=[];self.scripts=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script':
                a=dict(attrs)
                self.active=not a.get('src') and a.get('type','') not in ('application/json','application/ld+json')
                self.buf=[]
            def handle_data(self,data):
              if self.active:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.active:
                self.scripts.append(''.join(self.buf));self.active=False
          parser=ScriptParser();parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert len(parser.scripts)>=10, f'Unexpected script count: {len(parser.scripts)}'
          for i,script in enumerate(parser.scripts):Path(f'/tmp/block-party-script-{i}.js').write_text(script,encoding='utf-8')
          print('Checking',len(parser.scripts),'inline scripts')
          PY
          for f in /tmp/block-party-script-*.js; do node --check "$f"; done
      - name: Publish only after successful syntax checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix loading freeze and restore Campaign progress bar (v2.4.110)"
          git push origin HEAD:main
