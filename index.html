   arena.style.setProperty('--versus-zone-width',Math.floor(zoneWidth)+'px');

   return;
 }

 const reserve=top+padHeight+28;
 const available=Math.max(220,vh-reserve);

 const lf=loserFrame.getBoundingClientRect(),wf=winnerFrame.getBoundingClientRect();
 const lr=loseRect?{x:lf.left+loseRect.left,y:lf.top+loseRect.top,w:loseRect.width,h:loseRect.height}:lf;
 const wr=winRect?{x:wf.left+winRect.left,y:wf.top+winRect.top,w:winRect.width,h:winRect.height}:wf;
 const particles=[],sparks=[];
 // Capture the loser's actual colored blocks so each tile flies away intact.
 if(loserCanvas){
  const unit=loserCanvas.width/6;
  for(let r=0;r<12;r++)for(let c=0;c<6;c++){
   const sw=unit,sh=unit;
   const probe=document.createElement('canvas');probe.width=30;probe.height=30;
   const pc=probe.getContext('2d');pc.drawImage(loserCanvas,c*sw,r*sh,sw,sh,0,0,30,30);
   const px=pc.getImageData(15,15,1,1).data;
   // Ignore dark empty squares.
   if(px[0]<65&&px[1]<85&&px[2]<120)continue;
   particles.push({img:probe,x:lr.x+(c+.5)*lr.w/6,y:lr.y+(r+.5)*lr.h/12,
    vx:(Math.random()-.5)*950,vy:-250-Math.random()*620,
    spin:(Math.random()-.5)*13,angle:0,sz:lr.w/6});
  }
 }
 const palette=['#ffe16a','#ff5b9a','#72e9ff','#d6a1ff','#8dffbf','#fff'];
 const startTime=performance.now();let nextBurst=0;
 function burst(t){
  const x=wr.x+wr.w*(.12+Math.random()*.76),y=wr.y+wr.h*(.12+Math.random()*.72);
  const color=palette[Math.floor(Math.random()*palette.length)];
  for(let i=0;i<48;i++){const a=Math.random()*Math.PI*2,sp=70+Math.random()*240;
   sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.65+Math.random()*.8,age:0,color});}
 }
 function frame(t){
  const elapsed=(t-startTime)/1000,dt=Math.min(.045,Math.max(0,(t-(frame.prev||t))/1000));frame.prev=t;
  cx.clearRect(0,0,w,h);
  if(elapsed<2.65){
   while(elapsed>nextBurst){burst(elapsed);nextBurst+=.25}
   for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=850*dt;p.angle+=p.spin*dt;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.angle);
    cx.globalAlpha=Math.max(0,1-Math.max(0,elapsed-1.9)/.7);
    cx.drawImage(p.img,-p.sz/2,-p.sz/2,p.sz,p.sz);cx.restore();
   }
   for(const s of sparks){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=75*dt;s.age+=dt;
    cx.globalAlpha=Math.max(0,1-s.age/s.life);
    cx.fillStyle=s.color;cx.beginPath();cx.arc(s.x,s.y,2.5,0,Math.PI*2);cx.fill();
   }
   cx.globalAlpha=1;
   for(let i=sparks.length-1;i>=0;i--)if(sparks[i].age>sparks[i].life)sparks.splice(i,1);
   victoryFrame=requestAnimationFrame(frame);
  }else{layer.hidden=true;showVictory(winner)}
 }
 victoryFrame=requestAnimationFrame(frame);
 // Remove the loser's real board immediately after capturing its tiles for the explosion.
 tell(losing,{bp:'wipe'});
}
function showVictory(winner){
 $('victoryTitle').textContent=winner==='human'?'YOU WIN!':winner==='cpu'?'COMPUTER WINS!':'IT’S A TIE!';
 $('victorySubtitle').textContent=winner==='tie'?'Both players survived the round.':winner==='human'?'You outlasted the computer!':'The computer survived longer this time.';
 $('victoryDialog').hidden=false;
}
$('victoryAgain').onclick=()=>{hideVictory();start()};
$('victoryMenu').onclick=()=>{hideVictory();$('back').click()};
function finish(winner){
 if(!started)return;
 const winnerName=winner||'tie';
 $('message').textContent=winnerName==='tie'?'TIE GAME':winnerName==='human'?'YOU WIN!':'COMPUTER WINS!';
 tell('human',{bp:'stop'});tell('cpu',{bp:'stop'});started=false;
 if(isVersus&&winnerName!=='tie')celebrate(winnerName);
 else showVictory(winnerName);
}
function command(key){if(started)tell('human',{bp:'input',key})} $('raiseRow').onclick=()=>{if(started)tell('human',{bp:'raise'})};
let repeating=null,delay=null;document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();clearTimeout(delay);clearInterval(repeating);document.querySelectorAll('[data-key].pressed').forEach(el=>el.classList.remove('pressed'));b.classList.add('pressed');command(b.dataset.key);b.setPointerCapture(e.pointerId);if(b.dataset.key!=='Space')delay=setTimeout(()=>repeating=setInterval(()=>command(b.dataset.key),85),230)};const stop=()=>{clearTimeout(delay);clearInterval(repeating);b.classList.remove('pressed')};b.onpointerup=stop;b.onpointercancel=stop;b.onlostpointercapture=stop});$('raiseRow').addEventListener('pointerdown',()=> $('raiseRow').classList.add('pressed'));['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(evt=>$('raiseRow').addEventListener(evt,()=> $('raiseRow').classList.remove('pressed')));
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)&&started){e.preventDefault();const key=e.key===' '?'Space':e.key;command(key);document.querySelectorAll('[data-key]').forEach(b=>{if(b.dataset.key===key)b.classList.add('pressed')})}});document.addEventListener('keyup',e=>{const key=e.key===' '?'Space':e.key;document.querySelectorAll('[data-key]').forEach(b=>{if(b.dataset.key===key)b.classList.remove('pressed')})});window.addEventListener('blur',()=>document.querySelectorAll('.pressed').forEach(b=>b.classList.remove('pressed')));
</script></html>
